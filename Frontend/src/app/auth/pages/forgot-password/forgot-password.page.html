<ion-content class="forgot-password-container">
  <div class="forgot-password-card">

    <h2>Forgot Password?</h2>
    <p>Enter your email address to get the password reset link.</p>

    <div class="email-field">
      <ion-icon name="mail-outline"></ion-icon>
      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
      />
    </div>

    <button type="button" class="reset-btn" (click)="requestReset()" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Envoi en cours...' : 'Reset Password' }}
    </button>

    <p *ngIf="message" class="reset-message">{{ message }}</p>

    <p class="back-to-login">
      <a (click)="backlogin()">BACK TO LOG IN</a>
    </p>
  </div>
  <ion-img src="assets/background/3275434RM.png" class="background-image"></ion-img>
</ion-content>
