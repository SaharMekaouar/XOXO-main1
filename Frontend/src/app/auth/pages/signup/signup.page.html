<ion-content class="ion-padding signup-content" [fullscreen]="true">
  <div class="form-container">
    <div class="signup-header">
      <button type="button" class="back-button" (click)="Home()" aria-label="Back">
        <img src="assets/icon/left.jpeg" alt="Back" />
      </button>
      <img class="logo" src="assets/icon/Logo2.png" alt="Recapify" />
    </div>

    <form class="signup-form" (ngSubmit)="signup()">
      <input
        class="text-field"
        [(ngModel)]="user.name"
        name="name"
        placeholder="Full Name"
        required
        autocomplete="name"
      />

      <input
        class="text-field"
        [(ngModel)]="user.email"
        name="email"
        type="email"
        placeholder="Email"
        required
        autocomplete="email"
      />

      <input
        class="text-field"
        [(ngModel)]="user.phone"
        name="phone"
        type="tel"
        placeholder="Phone Number (optional)"
        autocomplete="tel"
      />

      <input
        class="text-field"
        [(ngModel)]="user.password"
        name="password"
        type="password"
        placeholder="Password"
        required
        autocomplete="new-password"
      />

      <button
        class="signup-button"
        type="submit"
        [disabled]="isLoading || !user.name || !user.email || !user.password"
      >
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <span *ngIf="!isLoading">Sign Up</span>
      </button>
    </form>

    <div class="divider"><span>or</span></div>

    <div *ngIf="!isNative" id="googleSignInButton" class="google-signin-container"></div>
    <button *ngIf="isNative" type="button" class="google-button" (click)="continueWithGoogle()">
      Continue with Google
    </button>

    <p class="back-to-login">
      Already have an account?
      <a (click)="backlogin()">Login</a>
    </p>
  </div>
  <ion-img src="assets/background/6333213RM.png" class="background-image"></ion-img>
</ion-content>
