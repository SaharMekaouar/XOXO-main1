<ion-content class="login-content" [fullscreen]="true">
  <div class="login-page">
    <div class="login-container">
      <div class="login-header">
        <button type="button" class="back-button" (click)="Home()" aria-label="Back">
          <img src="assets/icon/left.jpeg" alt="Back" />
        </button>
        <img class="logo" src="assets/icon/Logo2.png" alt="Recapify" />
      </div>

      <form class="login-form" (ngSubmit)="login()" #loginForm="ngForm">
        <div class="field-group">
          <input
            class="text-field"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Email"
            required
            autocomplete="email"
            #emailField="ngModel"
          />
          <div *ngIf="emailField.invalid && emailField.touched" class="error-text">
            Email is required.
          </div>
        </div>

        <div class="field-group">
          <input
            class="text-field"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password"
            #passwordField="ngModel"
          />
          <div *ngIf="passwordField.invalid && passwordField.touched" class="error-text">
            Password is required.
          </div>
        </div>

        <button
          class="login-button"
          type="submit"
          [disabled]="isLoading || loginForm.invalid">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Login</span>
        </button>

        <div class="divider"><span>or</span></div>

        <div *ngIf="!isNative" id="googleSignInButton" class="google-signin-container"></div>
        <button *ngIf="isNative" type="button" class="google-button" (click)="continueWithGoogle()">
          Continue with Google
        </button>

        <p class="forgot-password">
          <a (click)="forgotPassword()">Having issues with your password?</a>
        </p>

        <p class="back-to-signup">
          Don't have an account? <a (click)="backsignup()">Sign Up</a>
        </p>
      </form>
    </div>

    <img src="assets/background/3094352RM.png" class="background-image" alt="" />
  </div>
</ion-content>
