<ion-content class="verify-email-content" [fullscreen]="true">
  <div class="verify-email-page">
    <div class="verify-email-container">
      <div class="verify-email-header">
        <img class="logo" src="assets/icon/Logo2.png" alt="Recapify" />
      </div>

      <div class="info-state">
        <div class="info-icon">ℹ️</div>
        <h2>Email Verification</h2>
        <p>Please check your email for the verification code. Enter the code in the verification page to complete the process.</p>
        <button class="action-button" (click)="goToVerification()">
          Go to Verification Page
        </button>
      </div>
    </div>

    <img src="assets/background/3094352RM.png" class="background-image" alt="" />
  </div>
</ion-content>
